{% load i18n static unfold %}

<div class="flex flex-row gap-4 items-center ml-auto" x-data="{ 
        yasminOpen: false, 
        yasminTab: 'guide',
        yasminContent: '', 
        yasminTitle: 'Bantuan', 
        yasminVideo: '', 
        loading: false,
        
        chatInput: '',
        chatHistory: [],
        chatLoading: false,

        getKey() {
            let currentUrl = window.location.pathname;
            if (currentUrl.includes('/crm/santri/')) return 'crm.santri';
            if (currentUrl.includes('/core/lead/')) return 'core.lead';
            if (currentUrl.includes('/crm/tagihanspp/')) return 'crm.tagihanspp';
            if (currentUrl.includes('/hr/pengurus/')) return 'hr.pengurus';
            if (currentUrl.includes('/hr/absensi/')) return 'hr.absensi';
            if (currentUrl.includes('/hr/logamalan/')) return 'hr.logamalan';
            if (currentUrl == '/admin/') return 'dashboard';
            return 'general';
        },

        loadHelp() {
            this.loading = true;
            let key = this.getKey();
            fetch('/help/api/?key=' + key)
                .then(response => response.json())
                .then(data => {
                    this.yasminTitle = data.title;
                    this.yasminContent = data.content;
                    this.yasminVideo = data.video_url;
                    this.loading = false;
                });
        },

        sendChat() {
            if (!this.chatInput.trim() || this.chatLoading) return;
            
            this.chatHistory.push({ role: 'user', content: this.chatInput });
            let userMsg = this.chatInput;
            this.chatInput = '';
            this.chatLoading = true;

            fetch('/help/api/chat/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ 
                    message: userMsg, 
                    key: this.getKey(),
                    chat_history: this.chatHistory // Sending current history before the new assistant reply
                })
            })
            .then(res => res.json())
            .then(data => {
                let reply = data.reply || data.error || 'Maaf, terjadi kesalahan teknis.';
                this.chatHistory.push({ role: 'assistant', content: reply });
                this.chatLoading = false;
                this.$nextTick(() => {
                    let container = document.getElementById('chat-container');
                    if(container) container.scrollTop = container.scrollHeight;
                });
            });
        }
    }">
    {% if environment %}
    {% include "unfold/helpers/label.html" with text=environment.0 type=environment.1 %}
    {% endif %}


    {% action_list %}

    <!-- HELP BUTTON (REPOSITIONED & REFINED) -->
    <button type="button"
        class="flex items-center justify-center h-9 w-9 rounded-full hover:bg-base-100 dark:hover:bg-base-800 transition-colors text-base-500 dark:text-font-default-dark cursor-pointer border border-transparent hover:border-base-200 dark:hover:border-base-700"
        title="Bantuan Tutorial" x-on:click="yasminOpen = true; loadHelp()">
        <span class="material-symbols-outlined block text-[20px]">help</span>
    </button>

    {% if nav_global_side %}
    {{ nav_global_side }}
    {% endif %}

    <!-- HELP DRAWER (Offcanvas) -->
    <template x-teleport="body">
        <div x-show="yasminOpen" class="fixed inset-0 z-[99999] flex justify-end overflow-hidden" x-cloak>
            <!-- Overlay Backdrop -->
            <div x-show="yasminOpen" @click="yasminOpen = false" x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                class="fixed inset-0 bg-base-950/40 backdrop-blur-[2px] transition-opacity cursor-pointer"></div>

            <!-- Panel Content -->
            <div x-show="yasminOpen" @click.stop x-transition:enter="transform transition ease-in-out duration-500"
                x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
                x-transition:leave="transform transition ease-in-out duration-500"
                x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
                class="relative h-full bg-white dark:bg-base-900 shadow-2xl border-l border-base-200 dark:border-base-800 flex flex-col overflow-hidden pointer-events-auto"
                style="width: 100%; max-width: 450px; z-index: 999999 !important;">

                <!-- Header (Shifted down for mobile safety) -->
                <div class="px-5 py-6 pt-20 sm:pt-6 bg-primary-600 dark:bg-primary-500 shadow-md">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                                <span class="material-symbols-outlined text-white block">help_center</span>
                            </div>
                            <div>
                                <h2 class="text-xl font-black text-white leading-tight uppercase tracking-tight"
                                    id="slide-over-title">Yasmin</h2>
                                <p class="text-[10px] uppercase font-bold text-primary-100 tracking-widest opacity-80">
                                    Assistant Virtual</p>
                            </div>
                        </div>
                        <button type="button" class="group p-2 rounded-full hover:bg-white/10 transition-colors"
                            x-on:click="yasminOpen = false">
                            <span
                                class="material-symbols-outlined text-white group-hover:rotate-90 transition-transform duration-300">close</span>
                        </button>
                    </div>
                </div>

                <!-- Flat Tabs Navbar -->
                <div
                    class="flex w-full bg-base-100 dark:bg-base-950 border-b border-base-200 dark:border-base-800 shrink-0">
                    <button type="button" @click="yasminTab = 'guide'"
                        :class="yasminTab === 'guide' ? 'bg-white dark:bg-base-900 text-primary-600 border-b-2 border-primary-500' : 'text-base-500 hover:text-base-700'"
                        class="w-1/2 flex items-center justify-center gap-2 py-4 text-[10px] font-black uppercase tracking-widest transition-all">
                        <span class="material-symbols-outlined text-[18px]">menu_book</span>
                        Panduan
                    </button>
                    <div class="w-px bg-base-200 dark:bg-base-800 my-3"></div>
                    <button type="button" @click="yasminTab = 'chat'"
                        :class="yasminTab === 'chat' ? 'bg-white dark:bg-base-900 text-primary-600 border-b-2 border-primary-500' : 'text-base-500 hover:text-base-700'"
                        class="w-1/2 flex items-center justify-center gap-2 py-4 text-[10px] font-black uppercase tracking-widest transition-all">
                        <span class="material-symbols-outlined text-[18px]">forum</span>
                        Tanya AI
                    </button>
                </div>

                <!-- Content Area (Scrollable) -->
                <div class="flex-1 overflow-y-auto bg-white dark:bg-base-900 flex flex-col">

                    <!-- Tab Panduan -->
                    <div x-show="yasminTab === 'guide'" class="p-4 sm:p-6 h-full overflow-y-auto">
                        <!-- Loading State -->
                        <div x-show="loading"
                            class="flex flex-col items-center justify-center py-12 gap-3 text-base-400">
                            <div
                                class="w-8 h-8 border-4 border-primary-500 border-t-transparent rounded-full animate-spin">
                            </div>
                            <p class="text-xs uppercase font-bold tracking-widest">Memuat Panduan...</p>
                        </div>

                        <!-- Content State -->
                        <div x-show="!loading" class="animate-in fade-in duration-300">
                            <h3 class="font-black text-2xl text-base-900 dark:text-font-important-dark mb-4 leading-tight"
                                x-text="yasminTitle"></h3>
                            <div x-show="yasminVideo"
                                class="mb-6 rounded-xl overflow-hidden shadow-lg aspect-video bg-black">
                                <iframe x-show="yasminVideo" :src="yasminVideo" class="w-full h-full" frameborder="0"
                                    allowfullscreen></iframe>
                            </div>
                            <div
                                class="prose prose-sm dark:prose-invert max-w-none text-base-600 dark:text-font-default-dark/80 space-y-4">
                                <div x-html="yasminContent.replace(/\n/g, '<br>')"></div>
                            </div>
                            <div class="mt-12 pt-6 border-t border-base-100 dark:border-base-800">
                                <h4 class="text-xs font-bold uppercase text-base-400 mb-3">Butuh Bantuan Lebih Lanjut?
                                </h4>
                                <a href="https://wa.me/628123456789" target="_blank"
                                    class="flex items-center gap-3 p-3 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 transition-colors dark:bg-green-900/20 dark:text-green-400">
                                    <span class="material-symbols-outlined">chat</span>
                                    <span class="text-sm font-semibold">Tanya CS via WhatsApp</span>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Tab Chat AI -->
                    <div x-show="yasminTab === 'chat'" class="flex flex-col h-full overflow-hidden">
                        <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-5">
                            <!-- Welcome Message -->
                            <div class="flex items-start gap-3 w-full justify-start">
                                <div
                                    class="w-8 h-8 bg-primary-600 text-white rounded-full flex items-center justify-center flex-shrink-0 shadow-sm">
                                    <span class="material-symbols-outlined text-[18px]">smart_toy</span>
                                </div>
                                <div
                                    class="bg-base-100 dark:bg-base-800 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">
                                    <p class="text-xs text-base-600 dark:text-base-400">Halo! Saya Yasmin. Ada yang bisa
                                        saya bantu terkait fitur di halaman ini?</p>
                                </div>
                            </div>

                            <!-- History -->
                            <template x-for="msg in chatHistory">
                                <!-- Row Container -->
                                <div class="w-full flex" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                                    <div class="flex items-start gap-3 max-w-[85%]"
                                        :class="msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'">
                                        <!-- Avatar -->
                                        <div :class="msg.role === 'user' ? 'bg-primary-100 text-primary-600' : 'bg-primary-600 text-white'"
                                            class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 shadow-sm">
                                            <span class="material-symbols-outlined text-[18px]"
                                                x-text="msg.role === 'user' ? 'person' : 'smart_toy'"></span>
                                        </div>
                                        <!-- Bubble -->
                                        <div :class="msg.role === 'user' ? 'bg-primary-600 text-white rounded-tr-none' : 'bg-base-100 dark:bg-base-800 text-base-900 dark:text-font-default-dark rounded-tl-none'"
                                            class="p-4 rounded-2xl max-w-full text-xs shadow-sm chat-message">
                                            <div x-html="msg.content.replace(/\n/g, '<br>')"></div>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- Loading -->
                            <div x-show="chatLoading" class="flex items-start gap-3">
                                <div
                                    class="w-8 h-8 bg-primary-600 text-white rounded-full flex items-center justify-center flex-shrink-0 shadow-sm">
                                    <span class="material-symbols-outlined text-[18px]">smart_toy</span>
                                </div>
                                <div class="bg-base-100 dark:bg-base-800 p-4 rounded-2xl rounded-tl-none shadow-sm">
                                    <div class="flex gap-1">
                                        <div class="w-1.5 h-1.5 bg-base-400 rounded-full animate-bounce"></div>
                                        <div class="w-1.5 h-1.5 bg-base-400 rounded-full animate-bounce"
                                            style="animation-delay: 0.2s"></div>
                                        <div class="w-1.5 h-1.5 bg-base-400 rounded-full animate-bounce"
                                            style="animation-delay: 0.4s"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Chat Input Footer -->
                        <div class="p-4 bg-white dark:bg-base-900 border-t border-base-200 dark:border-base-800">
                            <form @submit.prevent="sendChat()" class="relative flex items-center gap-2">
                                <input type="text" x-model="chatInput" placeholder="Tulis pesan..."
                                    class="flex-1 py-3 px-4 bg-base-50 dark:bg-base-950 border border-base-200 dark:border-base-800 rounded-xl text-xs focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all dark:text-font-default-dark">
                                <button type="submit" :disabled="!chatInput.trim() || chatLoading"
                                    class="p-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl disabled:opacity-50 transition-all flex items-center justify-center shadow-lg active:scale-95">
                                    <span class="material-symbols-outlined text-[20px]">send</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Footer (Copyright) -->
                <div class="p-3 bg-base-50 dark:bg-base-950 border-t border-base-200 dark:border-base-800 shrink-0">
                    <p class="text-[9px] text-center text-base-400 uppercase tracking-widest font-bold">Yasmin Virtual
                        Assistant</p>
                </div>
            </div>
        </div>
    </template>
</div>

<style>
    [x-cloak] {
        display: none !important;
    }

    #chat-container::-webkit-scrollbar {
        width: 4px;
    }

    #chat-container::-webkit-scrollbar-track {
        background: transparent;
    }

    #chat-container::-webkit-scrollbar-thumb {
        background: #e5e7eb;
        border-radius: 10px;
    }

    .dark #chat-container::-webkit-scrollbar-thumb {
        background: #374151;
    }
</style>
